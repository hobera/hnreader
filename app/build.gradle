apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

repositories {
    // maven { url 'https://maven.fabric.io/public' } // Removed Fabric repository
}


android {
    namespace "com.hobera.app.hnreader"
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.hobera.app.hnreader"
        minSdkVersion 9
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        debug {
            // Crashlytics related fields removed
        }
        release {
            // Crashlytics related fields removed
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
    flavorDimensions "version"
    productFlavors {
        prod {
            dimension "version"
        }
        mock {
            dimension "version"
            applicationIdSuffix = ".mock"
        }
    }
    android.variantFilter { variant ->
        if(variant.buildType.name.equals('release')
                && variant.getFlavors().get(0).name.equals('mock')) {
            variant.setIgnore(true);
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

ext {
    // AndroidX versions from previous step, will update some
    androidxVersion = '1.6.1' // Updated for appcompat
    recyclerViewVersion = '1.3.1' // Specific for recyclerview
    materialVersion = '1.9.0' // Updated
    androidxTestEspressoVersion = '3.5.1' // Updated

    // Library specific versions
    retrofitVersion = '2.9.0' // Updated
    rxAndroidVersion = '2.1.1' // Updated (rxJavaVersion was a typo, it's for rxandroid)
    timberVersion = '5.0.1' // Updated
    junitVersion = '4.13.2' // Updated
    mockitoCoreVersion = '5.3.1' // New, for mockito-core

    // Firebase
    firebaseCrashlyticsKtxVersion = '18.4.3'
    firebaseAnalyticsKtxVersion = '21.3.0'
    // crashlyticsVersion was for Fabric, can be removed or ignored
}

dependencies {
    androidTestImplementation("androidx.test.espresso:espresso-core:$androidxTestEspressoVersion")
    // Removed exclusion as Jetifier should handle support-annotations or it's no longer an issue with androidxTestEspressoVersion

    implementation "androidx.appcompat:appcompat:$androidxVersion"
    implementation "androidx.recyclerview:recyclerview:$recyclerViewVersion" // Use specific version
    implementation "com.google.android.material:material:$materialVersion"

    implementation "com.squareup.retrofit2:retrofit:$retrofitVersion"
    implementation "com.squareup.retrofit2:converter-gson:$retrofitVersion"
    implementation "com.squareup.retrofit2:adapter-rxjava2:$retrofitVersion" // RxJava2 adapter for Retrofit
    implementation "io.reactivex.rxjava2:rxandroid:$rxAndroidVersion" // RxAndroid

    implementation "com.jakewharton.timber:timber:$timberVersion"

    // Firebase Crashlytics and Analytics
    implementation "com.google.firebase:firebase-crashlytics-ktx:$firebaseCrashlyticsKtxVersion"
    implementation "com.google.firebase:firebase-analytics-ktx:$firebaseAnalyticsKtxVersion"

    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.mockito:mockito-core:$mockitoCoreVersion" // Replaced mockito-all
}